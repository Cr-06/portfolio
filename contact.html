<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cole Rose | Contact</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body id="contact">

    <header>
        <nav>
            <a class="site-name" href="index.html">Cole Rose</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="about.html">About me</a></li>
                <li><a href="contact.html" class="active"><u>Contact</u></a></li>
            </ul>
        </nav>
    </header>

    <main id="contact-main">


        <div class="contact-layout">


            <div class="contact-info-col">
                <p class="contact-tagline">Thank you for visiting my website!</p>

                <ul class="contact-links">
                    <li>
                        <span class="contact-label">Email:</span>
                        <a href="#">colemrose@gmail.com</a>
                    </li>
                    <li>
                        <span class="contact-label">GitHub:</span>
                        <a href="https://github.com/Cr-06" target="_blank"
                            rel="noopener noreferrer">github.com/Cr-06</a>
                    </li>
                    <li>
                        <span class="contact-label">LinkedIn:</span>
                        <a href="https://www.linkedin.com/in/cole-rose1/" target="_blank"
                            rel="noopener noreferrer">linkedin.com/in/cole-rose1</a>
                    </li>
                </ul>


                <section class="contact-form-section" aria-label="Contact Form">
                    <h2>Contact Form:</h2>
                    <form action="#" method="post" novalidate>
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required />
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required />
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="4" placeholder="Write your message here..."
                                required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </section>
            </div>

            <aside class="resume-col" aria-label="Resume">
                <h2>Resume</h2>
                <div class="resume-preview" aria-label="Resume preview">
                    <img src="#" alt="Preview of my resume" width="180" height="240" />
                </div>
                <a href="#" class="download-btn" download aria-label="Download resume as PDF">
                    Download as PDF
                </a>
            </aside>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cole Rose</p>
    </footer>

    <script src="main.js"></script>
</body>

</html>
